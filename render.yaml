services:
  - type: web
    name: auto-ani-website
    env: node
    plan: starter
    region: frankfurt  # Closest to Kosovo for optimal latency
    branch: main

    # Build and start commands
    buildCommand: npm ci && npm run build
    startCommand: npm start

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://auto-ani-website.onrender.com

      # Performance optimizations
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"

      # Contact form configuration (optional)
      - key: CONTACT_EMAIL
        value: contact@autosalonani.com

    # Auto-deployment
    autoDeploy: true

    # Custom headers for optimization
    headers:
      - path: "/_next/static/*"
        headers:
          - key: "Cache-Control"
            value: "public, max-age=31536000, immutable"
      - path: "/images/*"
        headers:
          - key: "Cache-Control"
            value: "public, max-age=604800"
      - path: "/api/*"
        headers:
          - key: "Cache-Control"
            value: "no-store, must-revalidate"
