<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="250" fill="#FF6B35" stroke="#FFFFFF" stroke-width="12"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Inner Circle -->
  <circle cx="256" cy="256" r="220" fill="#FFFFFF"/>

  <!-- Car Icon Silhouette (simplified modern car shape) -->
  <g transform="translate(256, 256)">
    <!-- Car Body -->
    <path d="M -120 -20
             C -120 -40, -110 -60, -90 -60
             L -60 -60
             L -40 -90
             L 40 -90
             L 60 -60
             L 90 -60
             C 110 -60, 120 -40, 120 -20
             L 120 10
             L 110 10
             L 110 20
             C 110 30, 100 40, 90 40
             L 70 40
             C 60 40, 50 30, 50 20
             L 50 10
             L -50 10
             L -50 20
             C -50 30, -60 40, -70 40
             L -90 40
             C -100 40, -110 30, -110 20
             L -110 10
             L -120 10
             Z"
          fill="#FF6B35"
          stroke="#333333"
          stroke-width="2"/>

    <!-- Windows -->
    <rect x="-35" y="-80" width="70" height="35" rx="5" fill="#4A5568" opacity="0.3"/>
    <line x1="0" y1="-80" x2="0" y2="-45" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Wheels -->
    <circle cx="-70" cy="35" r="20" fill="#333333"/>
    <circle cx="-70" cy="35" r="10" fill="#666666"/>
    <circle cx="70" cy="35" r="20" fill="#333333"/>
    <circle cx="70" cy="35" r="10" fill="#666666"/>

    <!-- Headlights -->
    <ellipse cx="-115" cy="-10" rx="8" ry="12" fill="#FFDD00"/>
    <ellipse cx="115" cy="-10" rx="8" ry="12" fill="#FFDD00"/>
  </g>

  <!-- Text: AUTO ANI -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="72" font-weight="bold"
        text-anchor="middle" fill="#333333">AUTO</text>
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="72" font-weight="bold"
        text-anchor="middle" fill="#FF6B35">ANI</text>

  <!-- Decorative Line -->
  <rect x="156" y="350" width="200" height="4" fill="#FF6B35"/>
</svg>